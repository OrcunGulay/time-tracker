[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timetracker-agent"
version = "0.1.0"
description = "Aktivite & Zaman Takip Desktop Agent (gizlilik odakli, tus icerigi kaydetmez)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
  "pynput>=1.7.6",
  "mss>=9.0.1",
  "Pillow>=10.0.0",
  "psutil>=5.9.5",
  "PyYAML>=6.0",
  "pystray>=0.19.4",
]

[project.optional-dependencies]
macos = [
  "pyobjc-framework-Cocoa>=9.2",
  "pyobjc-framework-Quartz>=9.2",
  "pyobjc-framework-ApplicationServices>=9.2",
]
windows = ["pywin32>=306", "pygetwindow>=0.0.9"]
dev = ["pytest>=7.4.0"]

[project.scripts]
tt-agent = "tt_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["tt_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
