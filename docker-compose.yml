# Geliştirme ortamı bağımlılıkları.
#
#   docker compose up -d            -> yalnızca MinIO + bucket bootstrap
#   docker compose --profile local-pg up -d  -> yerel Postgres yerine container Postgres
#
# Yerel PostgreSQL 17 (Postgres.app) kullanılıyorsa yalnızca MinIO gerekir.
services:
  minio:
    image: minio/minio:latest
    container_name: tt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ttadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ttadmin123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    container_name: tt-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-ttadmin} ${MINIO_ROOT_PASSWORD:-ttadmin123} &&
      mc mb --ignore-existing local/${S3_BUCKET:-screenshots} &&
      mc anonymous set none local/${S3_BUCKET:-screenshots} &&
      echo '[minio-init] bucket hazir: ${S3_BUCKET:-screenshots}'
      "

  postgres:
    image: postgres:17-alpine
    container_name: tt-postgres
    profiles: ["local-pg"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tt}
      POSTGRES_DB: ${POSTGRES_DB:-timetracker}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tt} -d ${POSTGRES_DB:-timetracker}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  minio-data:
  pg-data:
